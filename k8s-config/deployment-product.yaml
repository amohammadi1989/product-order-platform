apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  selector:
    matchLabels:
      app: product-service
  replicas: 2
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service:3.0
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7070
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service
  sessionAffinity: None
  ports:
    - protocol: "TCP"
      port: 7070
      targetPort: 7070
  type: NodePort