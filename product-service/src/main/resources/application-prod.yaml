server:
  port: 7070
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/product_db
    username: product
    password: product
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true